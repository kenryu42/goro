[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/kenryu42/goro"

[workspace.dependencies]
goro-core = { path = "crates/goro-core" }
goro-ui = { path = "crates/goro-ui" }

anyhow = "1"
thiserror = "2"
futures = "0.3"
rayon = "1.11"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
unicode-segmentation = "1"

# UI: gpui-kit pins the matching gpui-pre crates. Upgrades are deliberate, one-commit changes.
gpui-kit = { version = "=0.6.6", default-features = false }

gix = { version = "0.87", default-features = false, features = ["status", "parallel", "sha1", "max-performance-safe"] }
imara-diff = "0.2"
tree-sitter = "0.27"
tree-sitter-highlight = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-json = "0.24"
tree-sitter-md = "0.5"

[profile.release]
codegen-units = 1
lto = "thin"
debug = "line-tables-only"
